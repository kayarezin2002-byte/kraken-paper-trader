openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: paper-trader
    description: Paper trading dashboard and simulation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Legacy BTC-only endpoints (backward compat) ────────────────────────────
  /paper-trader/state:
    get:
      operationId: getPaperTraderState
      tags: [paper-trader]
      summary: Get current BTC paper trading state
      responses:
        "200":
          description: Current BTC paper trading state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTraderState"
  /paper-trader/refresh:
    post:
      operationId: refreshPaperTrader
      tags: [paper-trader]
      summary: Refresh BTC market data and evaluate strategy
      responses:
        "200":
          description: Refreshed BTC paper trading state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTraderState"
        "502":
          description: Kraken public API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /paper-trader/trades:
    get:
      operationId: listPaperTrades
      tags: [paper-trader]
      summary: List simulated BTC trades
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Simulated BTC trade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperTrade"
  /paper-trader/reset:
    post:
      operationId: resetPaperTrader
      tags: [paper-trader]
      summary: Reset the BTC virtual account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPaperTraderInput"
      responses:
        "200":
          description: Reset BTC paper trading state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperTraderState"

  # ── Multi-coin endpoints ───────────────────────────────────────────────────
  /paper-trader/multi-state:
    get:
      operationId: getMultiCoinState
      tags: [paper-trader]
      summary: Get paper trading state for all six instruments
      description: Returns BTC, ETH, SOL, XRP plus GOLD and SILVER (paper trading, unvalidated strategy) states in one call.
      responses:
        "200":
          description: All coin states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiCoinState"
  /paper-trader/multi-refresh:
    post:
      operationId: refreshMultiCoin
      tags: [paper-trader]
      summary: Refresh market data and strategy for all six instruments
      description: Fetches Kraken public data for BTC, ETH, SOL, and XRP, plus gold-api.com spot prices and Yahoo Finance futures candles for GOLD and SILVER (paper trading, unvalidated strategy), and evaluates each strategy.
      responses:
        "200":
          description: Refreshed multi-coin state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiCoinState"
        "502":
          description: Kraken public API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /paper-trader/engine:
    get:
      operationId: getEngineStatus
      tags: [paper-trader]
      summary: Background strategy-scan engine status (server-side scheduler)
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"

  /engine/test-alert:
    post:
      operationId: testEngineAlert
      tags: [health]
      summary: Send a test webhook alert to verify ALERT_WEBHOOK_URL connectivity
      description: |
        Fires a clearly-marked test payload to ALERT_WEBHOOK_URL so you can
        confirm the webhook is wired correctly without waiting for 3 consecutive
        scan failures.  The payload includes `"test": true` and a `[TEST]` prefix
        in the message text.  Always returns HTTP 200 — check the `ok` field in
        the response body for actual delivery success or failure.
      security:
        - bearerAdminToken: []
      responses:
        "200":
          description: Test result (check `ok` for delivery success/failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAlertResult"
        "401":
          description: Missing or invalid ALERT_ADMIN_TOKEN bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAlertResult"
        "503":
          description: ALERT_ADMIN_TOKEN not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAlertResult"

  /engine/status:
    get:
      operationId: getEngineHealthStatus
      tags: [health]
      summary: Engine health check for external uptime monitors
      description: |
        Returns HTTP 200 when the background scheduler is RUNNING or STARTING.
        Returns HTTP 503 when the scheduler is in ERROR state.

        Point UptimeRobot / Better Uptime / any ping service at this endpoint.
        Configure an alert when the endpoint returns non-2xx or stops responding.
      responses:
        "200":
          description: Engine is healthy (RUNNING or STARTING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineHealthStatus"
        "503":
          description: Engine is in ERROR state — consecutive scan failures detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineHealthStatus"

  /paper-trader/portfolio:
    get:
      operationId: getPortfolioSummary
      tags: [paper-trader]
      summary: Get combined portfolio summary across all six instruments
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
  /paper-trader/activity:
    get:
      operationId: listActivityLog
      tags: [paper-trader]
      summary: Get the recent activity log
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Activity log entries newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /paper-trader/chart:
    get:
      operationId: getChartData
      tags: [paper-trader]
      summary: Price candles + indicators for one asset (visualisation only)
      parameters:
        - name: asset
          in: query
          required: true
          schema:
            type: string
            description: BTC/ETH/SOL/XRP/GOLD/SILVER or any scanner-universe ticker (e.g. DOGE, LINK, PEPE)
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24H, 7D, 30D, 90D]
            default: 7D
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [15m, 1h, 4h]
          description: Candle timeframe. Defaults per range (24H→15m, 7D/30D→1h, 90D→4h).
      responses:
        "200":
          description: Chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartData"

  /paper-trader/all-trades:
    get:
      operationId: listAllTrades
      tags: [paper-trader]
      summary: List simulated trades for all coins
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: All simulated trades newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperTrade"
  /paper-trader/pnl-series:
    get:
      operationId: getPnlSeries
      tags: [paper-trader]
      summary: Cumulative P&L time-series for all coins
      description: Returns a per-coin (and combined crypto) time-series of cumulative profit/loss, suitable for plotting an equity curve. Covers all historical paper trades from the database.
      responses:
        "200":
          description: P&L series per asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PnlSeriesResult"

  /paper-trader/active-mode:
    post:
      operationId: setActiveMode
      tags: [paper-trader]
      summary: Set the ACTIVE strategy threshold mode (CONSERVATIVE 5/6, NORMAL 4/6, AGGRESSIVE 3/6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveModeInput"
      responses:
        "200":
          description: New mode applied (takes effect on the next scan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetActiveModeResult"

  /paper-trader/reset-all:
    post:
      operationId: resetAllCoins
      tags: [paper-trader]
      summary: Reset all six virtual accounts
      description: Resets BTC, ETH, SOL, and XRP accounts to the requested starting balance and clears history. GOLD and SILVER always reset to their fixed $100 baseline.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPaperTraderInput"
      responses:
        "200":
          description: All coins reset — returns new multi-coin state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiCoinState"

  /market/scanner:
    get:
      operationId: getMarketDirectory
      tags: [market]
      summary: Full crypto scanner directory — every asset with scores, ticker data and signal
      responses:
        "200":
          description: Directory of all scanned cryptocurrencies plus market stats and SCANNER account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDirectory"

  /market/asset/{ticker}:
    get:
      operationId: getMarketAsset
      tags: [market]
      summary: Detailed scanner view of one cryptocurrency
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset detail with engine scores, conditions and diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAssetDetail"

  /market/watchlist:
    post:
      operationId: toggleWatchlist
      tags: [market]
      summary: Add or remove a cryptocurrency from the personal watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistToggleInput"
      responses:
        "200":
          description: New watchlist state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ticker: { type: string }
                  watchlisted: { type: boolean }
                  watchlist:
                    type: array
                    items: { type: string }
                required: [ok]

  /market/elliott-lab:
    get:
      operationId: getElliottLab
      tags: [market]
      summary: ELLIOTT LAB — experimental Elliott Wave analytics (observation only, never gates trades)
      responses:
        "200":
          description: Elliott candidates across the scanner universe plus the aligned-vs-not trade experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElliottLab"

  /market/lab-overview:
    get:
      operationId: getLabOverview
      tags: [market]
      summary: STRATEGY LAB — shadow-strategy experiments (simulation only, never trades)
      responses:
        "200":
          description: Leaderboard, breakdowns and experiment summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabOverview"

  /market/lab-strategy:
    get:
      operationId: getLabStrategy
      tags: [market]
      summary: STRATEGY LAB — equity curve and risk table for one strategy
      parameters:
        - name: strategy
          in: query
          required: true
          schema: { type: string }
        - name: start
          in: query
          required: false
          schema: { type: number }
        - name: risk
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Equity curve, drawdown and risk models for the strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabStrategyDetail"

  /market/scanner-positions:
    get:
      operationId: getScannerPositions
      tags: [market]
      summary: Open SCANNER-account paper positions
      responses:
        "200":
          description: Open scanner positions with live unrealised P&L
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerPosition"

components:
  schemas:
    WatchlistToggleInput:
      type: object
      properties:
        ticker: { type: string }
      required: [ticker]

    ElliottTimeframe:
      type: object
      properties:
        timeframe: { type: string }
        structure: { type: string }
        wave: { type: string, nullable: true }
        direction: { type: string }
        confidence: { type: number }
        confidenceLabel: { type: string }
        notes:
          type: array
          items: { type: string }
        fibLocation: { type: string, nullable: true }
        wave3Candidate: { type: boolean }
        wave5Exhaustion: { type: boolean }
        abcCandidate: { type: boolean }
      required: [timeframe, structure, direction, confidence, confidenceLabel]

    ElliottAnalysis:
      type: object
      description: Experimental Elliott Wave read — analytics only, never influences entries
      properties:
        structure: { type: string }
        wave: { type: string, nullable: true }
        direction: { type: string }
        confidence: { type: number }
        confidenceLabel: { type: string }
        headlineTimeframe: { type: string, nullable: true }
        alignment: { type: string, nullable: true }
        wave3Candidate: { type: boolean, nullable: true }
        wave5Exhaustion: { type: boolean, nullable: true }
        abcCandidate: { type: boolean, nullable: true }
        fibLocation: { type: string, nullable: true }
        timeframes:
          type: object
          nullable: true
          properties:
            "15m": { $ref: "#/components/schemas/ElliottTimeframe" }
            "1h": { $ref: "#/components/schemas/ElliottTimeframe" }
            "4h": { $ref: "#/components/schemas/ElliottTimeframe" }
      required: [structure, direction, confidence, confidenceLabel]

    ElliottLabCandidate:
      type: object
      properties:
        ticker: { type: string }
        name: { type: string, nullable: true }
        structure: { type: string, nullable: true }
        wave: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        confidenceLabel: { type: string, nullable: true }
        alignment: { type: string, nullable: true }
        signal: { type: string, nullable: true }
        longScore: { type: number, nullable: true }
        shortScore: { type: number, nullable: true }
      required: [ticker]

    ElliottBucketStats:
      type: object
      properties:
        trades: { type: number }
        wins: { type: number }
        losses: { type: number }
        winRate: { type: number, nullable: true }
        netPnl: { type: number }
        avgWin: { type: number, nullable: true }
        avgLoss: { type: number, nullable: true }
        profitFactor: { type: number, nullable: true }
        expectancy: { type: number, nullable: true }
        maxDrawdown: { type: number, nullable: true }
      required: [trades, wins, losses, netPnl]

    ElliottLab:
      type: object
      properties:
        flags:
          type: object
          properties:
            elliottScoreInfluence: { type: string }
            wave5Veto: { type: string }
            activeGate: { type: string }
          required: [elliottScoreInfluence, wave5Veto, activeGate]
        wave3Candidates:
          type: array
          items: { $ref: "#/components/schemas/ElliottLabCandidate" }
        wave5ExhaustionCandidates:
          type: array
          items: { $ref: "#/components/schemas/ElliottLabCandidate" }
        abcCandidates:
          type: array
          items: { $ref: "#/components/schemas/ElliottLabCandidate" }
        strongestStructures:
          type: array
          items: { $ref: "#/components/schemas/ElliottLabCandidate" }
        bullishAligned:
          type: array
          items: { type: string }
        bearishAligned:
          type: array
          items: { type: string }
        uncertain:
          type: array
          items: { type: string }
        tradeStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ElliottBucketStats"
      required: [flags, wave3Candidates, wave5ExhaustionCandidates, abcCandidates, strongestStructures, bullishAligned, bearishAligned, uncertain, tradeStats]

    LabStats:
      type: object
      description: Standard Strategy Lab metric block (R-based, net of costs)
      properties:
        trades: { type: number }
        confidence: { type: string }
        wins: { type: number }
        losses: { type: number }
        winRate: { type: number, nullable: true }
        netR: { type: number }
        roiPct: { type: number, nullable: true }
        profitFactor: { type: number, nullable: true }
        expectancy: { type: number, nullable: true }
        maxDrawdownPct: { type: number, nullable: true }
        sharpe: { type: number, nullable: true }
        avgWin: { type: number, nullable: true }
        avgLoss: { type: number, nullable: true }
        longestLossStreak: { type: number }
        insufficientData: { type: boolean }
      required: [trades, confidence]

    LabLeaderboardEntry:
      allOf:
        - $ref: "#/components/schemas/LabStats"
        - type: object
          properties:
            strategy: { type: string }
            threshold: { type: number }
            profile: { type: string }
            promotionCandidate: { type: boolean }
            riskPct: { type: number }
          required: [strategy, threshold, profile, promotionCandidate]

    LabDirectionStats:
      type: object
      properties:
        LONG: { $ref: "#/components/schemas/LabStats" }
        SHORT: { $ref: "#/components/schemas/LabStats" }
      required: [LONG, SHORT]

    LabNamedStats:
      allOf:
        - $ref: "#/components/schemas/LabStats"
        - type: object
          properties:
            name: { type: string }
          required: [name]

    LabRiskStats:
      allOf:
        - $ref: "#/components/schemas/LabStats"
        - type: object
          properties:
            riskPct: { type: number }
          required: [riskPct]

    LabDDSim:
      type: object
      properties:
        trades: { type: number }
        roiPct: { type: number }
        maxDrawdownPct: { type: number }
      required: [trades, roiPct, maxDrawdownPct]

    LabOverview:
      type: object
      properties:
        summary:
          type: object
          properties:
            experimentsRunning: { type: number }
            openShadowTrades: { type: number }
            totalShadowTrades: { type: number }
            totalSignals: { type: number }
            dataConfidence: { type: string }
            bestStrategy: { type: string, nullable: true }
            bestProfitFactor:
              type: object
              nullable: true
              properties:
                strategy: { type: string }
                value: { type: number, nullable: true }
              required: [strategy]
            bestExpectancy:
              type: object
              nullable: true
              properties:
                strategy: { type: string }
                value: { type: number, nullable: true }
              required: [strategy]
            lowestDrawdown:
              type: object
              nullable: true
              properties:
                strategy: { type: string }
                value: { type: number, nullable: true }
              required: [strategy]
            highestNetReturn:
              type: object
              nullable: true
              properties:
                strategy: { type: string }
                value: { type: number, nullable: true }
              required: [strategy]
            bestRiskAdjusted:
              type: object
              nullable: true
              properties:
                strategy: { type: string }
                value: { type: number, nullable: true }
              required: [strategy]
            feePctPerSide: { type: number }
            costsIncluded: { type: boolean }
            mainStrategyLocked: { type: string }
          required: [experimentsRunning, openShadowTrades, totalShadowTrades, totalSignals, dataConfidence, feePctPerSide, costsIncluded, mainStrategyLocked]
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/LabLeaderboardEntry" }
        longShort: { $ref: "#/components/schemas/LabDirectionStats" }
        perAsset:
          type: array
          items:
            type: object
            properties:
              ticker: { type: string }
              long: { $ref: "#/components/schemas/LabStats" }
              short: { $ref: "#/components/schemas/LabStats" }
            required: [ticker, long, short]
        elliott:
          type: object
          additionalProperties: { $ref: "#/components/schemas/LabStats" }
        regimes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/LabStats" }
        combinations:
          type: array
          items: { $ref: "#/components/schemas/LabNamedStats" }
        riskModels:
          type: array
          items: { $ref: "#/components/schemas/LabRiskStats" }
        drawdownProtection:
          type: object
          nullable: true
          properties:
            protected:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/LabDDSim" }]
            constant:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/LabStats" }]
        correlationProtection:
          type: object
          properties:
            off: { $ref: "#/components/schemas/LabStats" }
            on: { $ref: "#/components/schemas/LabStats" }
          required: [off, on]
        missedOpportunities:
          type: object
          properties:
            signalsBlocked: { type: number }
            performanceIfTaken: { $ref: "#/components/schemas/LabStats" }
          required: [signalsBlocked, performanceIfTaken]
      required: [summary, leaderboard, longShort, perAsset, elliott, regimes, combinations, riskModels, correlationProtection, missedOpportunities]

    LabStrategyDetail:
      type: object
      properties:
        ok: { type: boolean }
        error: { type: string, nullable: true }
        strategy: { type: string }
        startBalance: { type: number }
        riskPct: { type: number }
        stats: { $ref: "#/components/schemas/LabStats" }
        equity:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, nullable: true }
              balance: { type: number }
              drawdownPct: { type: number }
            required: [balance, drawdownPct]
        riskTable:
          type: array
          items: { $ref: "#/components/schemas/LabRiskStats" }
        drawdownProtection:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LabDDSim" }]
      required: [ok]

    ElliottChartOverlay:
      type: object
      description: Pivot labels and fib levels for the chart ELLIOTT/FIB toggles
      properties:
        structure: { type: string }
        wave: { type: string, nullable: true }
        direction: { type: string }
        confidence: { type: number }
        confidenceLabel: { type: string }
        pivots:
          type: array
          items:
            type: object
            properties:
              time: { type: number }
              price: { type: number }
              label: { type: string }
            required: [time, price, label]
        fib:
          type: object
          nullable: true
          properties:
            swingLow: { type: number }
            swingHigh: { type: number }
            retracements:
              type: object
              additionalProperties: { type: number }
            extensions:
              type: object
              additionalProperties: { type: number }
      required: [structure, direction, confidence, confidenceLabel, pivots]

    ScannerCondition:
      type: object
      properties:
        name: { type: string }
        currentValue: { type: string }
        requiredValue: { type: string }
        pass: { type: boolean }
      required: [name, pass]

    ScannerSignalChange:
      type: object
      properties:
        at: { type: string, nullable: true }
        longFrom: { type: number, nullable: true }
        longTo: { type: number, nullable: true }
        shortFrom: { type: number, nullable: true }
        shortTo: { type: number, nullable: true }

    ScannerAsset:
      type: object
      properties:
        ticker: { type: string }
        name: { type: string }
        rank: { type: number, nullable: true }
        price: { type: number, nullable: true }
        change24h: { type: number, nullable: true }
        high24: { type: number, nullable: true }
        low24: { type: number, nullable: true }
        volumeUsd: { type: number, nullable: true }
        spreadPct: { type: number, nullable: true }
        signal: { type: string, nullable: true }
        decision: { type: string, nullable: true }
        decisionReason: { type: string, nullable: true }
        longScore: { type: number, nullable: true }
        shortScore: { type: number, nullable: true }
        threshold: { type: number, nullable: true }
        maxScore: { type: number, nullable: true }
        trend15m: { type: string, nullable: true }
        trend1h: { type: string, nullable: true }
        trend4h: { type: string, nullable: true }
        longConditions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ScannerCondition"
        shortConditions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ScannerCondition"
        elliott:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ElliottAnalysis"
        lastScanAt: { type: string, nullable: true }
        nextScanAt: { type: string, nullable: true }
        lastCandleAt: { type: string, nullable: true }
        tradingEnabled: { type: boolean, nullable: true }
        disabledReason: { type: string, nullable: true }
        entryBlocker: { type: string, nullable: true }
        dataAvailable: { type: boolean, nullable: true }
        scanError: { type: string, nullable: true }
        hasPosition: { type: boolean, nullable: true }
        watchlisted: { type: boolean, nullable: true }
        lastSignalChange:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScannerSignalChange"
        position:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScannerPosition"
        stats:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AssetTradeStats"
      required: [ticker, name]

    AssetTradeStats:
      type: object
      properties:
        trades: { type: number }
        winRate: { type: number, nullable: true }
        pnl: { type: number }
        profitFactor: { type: number, nullable: true }
      required: [trades, pnl]

    ScannerPosition:
      type: object
      properties:
        ticker: { type: string }
        name: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        strategy: { type: string, nullable: true }
        account: { type: string, nullable: true }
        direction: { type: string }
        entry: { type: number }
        stopLoss: { type: number }
        initialStop: { type: number, nullable: true }
        takeProfit: { type: number }
        quantity: { type: number }
        riskAmount: { type: number, nullable: true }
        openedAt: { type: string }
        currentPrice: { type: number, nullable: true }
        unrealisedPnl: { type: number, nullable: true }
        bestPrice: { type: number, nullable: true }
        worstPrice: { type: number, nullable: true }
        entryScore: { type: number, nullable: true }
        maxScore: { type: number, nullable: true }
        entryThreshold: { type: number, nullable: true }
        longScore: { type: number, nullable: true }
        shortScore: { type: number, nullable: true }
        entryConditions: { type: string, nullable: true }
        trend1h: { type: string, nullable: true }
        entryAtr: { type: number, nullable: true }
      required: [ticker, direction, entry, stopLoss, takeProfit, quantity, openedAt]

    MarketStats:
      type: object
      properties:
        scanned: { type: number }
        universe: { type: number }
        counts:
          type: object
          additionalProperties: { type: number }
        openCryptoTrades: { type: number }
        nextScanAt: { type: string, nullable: true }
      required: [scanned, universe, counts, openCryptoTrades]

    ScannerAccount:
      type: object
      properties:
        currency: { type: string }
        balance: { type: number }
        startingBalance: { type: number }
        openPositions: { type: number }
        maxPositions: { type: number }
        riskPerTradePct: { type: number }
        maxTotalRiskPct: { type: number }
        maxSameDirection: { type: number }
        minVolumeUsd: { type: number }
      required: [currency, balance, startingBalance, openPositions, maxPositions]

    MarketDirectory:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ScannerAsset"
        marketStats:
          $ref: "#/components/schemas/MarketStats"
        scannerAccount:
          $ref: "#/components/schemas/ScannerAccount"
        watchlist:
          type: array
          items: { type: string }
      required: [assets, marketStats, scannerAccount, watchlist]

    MarketAssetDetail:
      type: object
      properties:
        ok: { type: boolean }
        error: { type: string, nullable: true }
        asset:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScannerAsset"
        isCoreCoin: { type: boolean, nullable: true }
        position:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScannerPosition"
        watchlisted: { type: boolean, nullable: true }
        lastTradeAt: { type: string, nullable: true }
        stats:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AssetTradeStats"
      required: [ok]

    PnlDataPoint:
      type: object
      properties:
        ts:
          type: string
          description: ISO timestamp when the trade closed
        cumulativePnl:
          type: number
          description: Cumulative profit/loss in account currency up to this trade
        cumulativePnlPct:
          type: number
          description: Cumulative P&L as a percentage of starting balance
        balance:
          type: number
          description: Account balance after this trade (absent for combined CRYPTO series)
          nullable: true
      required: [ts, cumulativePnl, cumulativePnlPct]

    PnlSeriesResult:
      type: object
      properties:
        series:
          type: object
          description: Map of asset key (BTC, ETH, SOL, XRP, GOLD, SILVER, CRYPTO) to its data points
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/PnlDataPoint"
        startingBalances:
          type: object
          description: Starting balance per asset key
          additionalProperties:
            type: number
      required: [series, startingBalances]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Indicators ─────────────────────────────────────────────────────────
    IndicatorSnapshot:
      type: object
      properties:
        rsi:
          type: ["number", "null"]
        macd:
          type: ["number", "null"]
        macdSignal:
          type: ["number", "null"]
        atr:
          type: ["number", "null"]
        ema20:
          type: ["number", "null"]
        ema50:
          type: ["number", "null"]
        volume:
          type: ["number", "null"]
      required: [rsi, macd, macdSignal, atr, ema20, ema50, volume]

    # ── Strategy conditions breakdown ──────────────────────────────────────
    StrategyCondition:
      type: object
      properties:
        name:
          type: string
        currentValue:
          type: string
        requiredValue:
          type: string
        pass:
          type: boolean
      required: [name, currentValue, requiredValue, pass]
    StrategyConditions:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyCondition"
        passCount:
          type: number
        totalCount:
          type: number
        bias:
          type: string
          enum: [LONG, SHORT, NEUTRAL]
        signal:
          type: string
          enum: [LONG, SHORT, NO_TRADE]
        oneHourTrend:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        fourHourTrend:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        indicators:
          $ref: "#/components/schemas/IndicatorSnapshot"
        long:
          $ref: "#/components/schemas/DirectionEval"
        short:
          $ref: "#/components/schemas/DirectionEval"
        decision:
          type: string
          enum: [LONG, SHORT, NO_TRADE]
      required: [conditions, passCount, totalCount, bias, signal, oneHourTrend, fourHourTrend, indicators]

    # ── Per-direction evaluation (dual-direction system) ────────────────────
    DirectionEval:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyCondition"
        passCount:
          type: number
        score:
          type: number
      required: [conditions, passCount, score]

    # ── Proposed trade (when signal is present but no position open) ────────
    ProposedTrade:
      type: object
      properties:
        direction:
          type: string
          enum: [LONG, SHORT]
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        riskAmount:
          type: number
        rewardAmount:
          type: number
        rrRatio:
          type: number
        quantity:
          type: number
      required: [direction, entry, stopLoss, takeProfit, riskAmount, rewardAmount, rrRatio, quantity]

    # ── Open position ───────────────────────────────────────────────────────
    OpenPosition:
      type: object
      properties:
        direction:
          type: string
          enum: [LONG, SHORT]
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        quantity:
          type: number
        riskAmount:
          type: number
        openedAt:
          type: string
        entryRsi:
          type: ["number", "null"]
        entryMacd:
          type: ["number", "null"]
        entryAtr:
          type: ["number", "null"]
        trend4h:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        trend1h:
          type: ["string", "null"]
        longScore:
          type: ["number", "null"]
        shortScore:
          type: ["number", "null"]
        entryThreshold:
          type: ["number", "null"]
        unrealisedPnl:
          type: ["number", "null"]
        unrealisedPct:
          type: ["number", "null"]
        currentPrice:
          type: ["number", "null"]
        bestPrice:
          type: ["number", "null"]
          description: Best (most favourable) price seen while the position has been open.
        worstPrice:
          type: ["number", "null"]
          description: Worst (most adverse) price seen while the position has been open.
        initialStop:
          type: ["number", "null"]
          description: Stop-loss at entry, before any break-even/trailing tightening.
      required: [direction, entry, stopLoss, takeProfit, quantity, riskAmount, openedAt, entryRsi, entryMacd, entryAtr, trend4h]

    # ── Trades ──────────────────────────────────────────────────────────────
    PaperTrade:
      type: object
      properties:
        id:
          type: number
        coin:
          type: string
        openedAt:
          type: string
        closedAt:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT]
        entry:
          type: number
        exit:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        rsi:
          type: ["number", "null"]
        macd:
          type: ["number", "null"]
        atr:
          type: ["number", "null"]
        trend4h:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        profitLoss:
          type: number
        accountBalance:
          type: number
        exitReason:
          type: string
          enum: [TAKE_PROFIT, STOP_LOSS, SIGNAL_REVERSAL, MAX_HOLD_TIME, MANUAL]
        riskAmount:
          type: ["number", "null"]
        rMultiple:
          type: ["number", "null"]
        pnlPct:
          type: ["number", "null"]
        durationSeconds:
          type: ["number", "null"]
        result:
          type: ["string", "null"]
          enum: [WIN, LOSS, BREAKEVEN, null]
        entryScore:
          type: ["number", "null"]
        passCount:
          type: ["number", "null"]
        trend1h:
          type: ["string", "null"]
        entryMode:
          type: ["string", "null"]
        entryConditions:
          type: ["string", "null"]
        longScore:
          type: ["number", "null"]
        shortScore:
          type: ["number", "null"]
        entryThreshold:
          type: ["number", "null"]
        strategy:
          type: ["string", "null"]
          description: CORE (1h strategy) or ACTIVE (15m strategy). Pre-upgrade rows report CORE.
        estFees:
          type: ["number", "null"]
          description: Estimated exchange fees (taker, both sides). Recorded only; paper fills are cost-free.
        estSlippage:
          type: ["number", "null"]
          description: Estimated slippage (half entry-time spread per side).
        pnlNet:
          type: ["number", "null"]
          description: profitLoss minus estimated fees and slippage.
      required: [id, coin, openedAt, closedAt, direction, entry, exit, stopLoss, takeProfit, rsi, macd, atr, trend4h, profitLoss, accountBalance, exitReason]

    # ── Metrics ─────────────────────────────────────────────────────────────
    PaperTraderMetrics:
      type: object
      properties:
        virtualBalance:
          type: number
        startingBalance:
          type: number
        totalProfitLoss:
          type: number
        roi:
          type: number
        numberOfTrades:
          type: number
        wins:
          type: number
        losses:
          type: number
        winRate:
          type: number
        profitFactor:
          type: number
        maximumDrawdown:
          type: number
        dailyLoss:
          type: number
        consecutiveLosses:
          type: number
      required: [virtualBalance, startingBalance, totalProfitLoss, roi, numberOfTrades, wins, losses, winRate, profitFactor, maximumDrawdown, dailyLoss, consecutiveLosses]

    # ── Single-coin state ───────────────────────────────────────────────────
    PaperTraderState:
      type: object
      properties:
        coin:
          type: string
        market:
          type: object
          properties:
            pair:
              type: string
            currentPrice:
              type: ["number", "null"]
            updatedAt:
              type: string
            lastCompletedCandleAt:
              type: ["string", "null"]
          required: [pair, currentPrice, updatedAt, lastCompletedCandleAt]
        signal:
          type: string
          enum: [LONG, SHORT, NO_TRADE]
        oneHourTrend:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        fourHourTrend:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        indicators:
          $ref: "#/components/schemas/IndicatorSnapshot"
        strategyConditions:
          oneOf:
            - $ref: "#/components/schemas/StrategyConditions"
            - type: "null"
        proposedTrade:
          oneOf:
            - $ref: "#/components/schemas/ProposedTrade"
            - type: "null"
        directional:
          oneOf:
            - $ref: "#/components/schemas/DirectionalEvaluation"
            - type: "null"
        executionDiagnostics:
          oneOf:
            - $ref: "#/components/schemas/ExecutionDiagnostics"
            - type: "null"
        opportunity:
          $ref: "#/components/schemas/Opportunity"
        position:
          oneOf:
            - $ref: "#/components/schemas/OpenPosition"
            - type: "null"
        activePosition:
          oneOf:
            - $ref: "#/components/schemas/OpenPosition"
            - type: "null"
          description: Open position held by the parallel ACTIVE (15m) strategy, if any.
        active:
          oneOf:
            - $ref: "#/components/schemas/ActiveStrategyState"
            - type: "null"
          description: Latest ACTIVE (15m) strategy scan diagnostics. Null until first scan.
        metrics:
          $ref: "#/components/schemas/PaperTraderMetrics"
        risk:
          type: object
          properties:
            dailyLossLimit:
              type: number
            maximumConsecutiveLosses:
              type: number
            riskPerTrade:
              type: number
            rewardToRisk:
              type: number
            pollingSeconds:
              type: number
          required: [dailyLossLimit, maximumConsecutiveLosses, riskPerTrade, rewardToRisk, pollingSeconds]
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/PaperTrade"
        botStatus:
          type: string
          enum: [READY, WAITING_FOR_DATA, RISK_PAUSED, API_ERROR, MONITORING]
        message:
          type: string
        scanNote:
          oneOf:
            - type: string
            - type: "null"
          description: Set when scan candle data (Yahoo Finance) is unavailable but spot price succeeded. Null otherwise.
        instrument:
          type: object
          description: Honest labelling of the instrument, its trading mode, and data source.
          properties:
            kind:
              type: string
              enum: [CRYPTO, METAL]
            tradingMode:
              type: string
              enum: [ACTIVE, MONITORING, PAPER_UNVALIDATED]
            statusLabel:
              type: string
            currency:
              type: string
              enum: [GBP, USD]
            priceType:
              type: string
              enum: [SPOT, FUTURES]
            dataSource:
              type: string
          required: [kind, tradingMode, statusLabel, currency, priceType, dataSource]
      required: [coin, market, signal, oneHourTrend, fourHourTrend, indicators, position, metrics, risk, recentTrades, botStatus, message, instrument, opportunity]

    DirectionalEvaluation:
      type: object
      description: >
        Independent LONG and SHORT setup evaluation (all six assets).
        Crypto scores are weighted (max 8, gate >= 6); metals are raw condition
        counts (max 6; GOLD gate 5, SILVER gate 5). A direction qualifies when
        its score reaches its own threshold. PAPER TRADING ONLY.
      properties:
        longScore:
          type: number
        shortScore:
          type: number
        threshold:
          type: number
        shortThreshold:
          type: ["number", "null"]
        maxScore:
          type: ["number", "null"]
        decision:
          type: string
          enum: [LONG, SHORT, NO_TRADE]
        reason:
          oneOf:
            - type: string
            - type: "null"
        longConditions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyCondition"
        shortConditions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyCondition"
      required: [longScore, shortScore, threshold, decision, reason, longConditions, shortConditions]

    Opportunity:
      type: object
      description: Weighted opportunity score, market mode and entry status (paper mode).
      properties:
        score:
          type: number
        maxScore:
          type: number
        mode:
          type: string
          enum: [TREND, RANGE, DANGER]
        entryStatus:
          type: string
          enum: [READY, WAIT, BLOCKED]
        reason:
          oneOf:
            - type: string
            - type: "null"
        nextEligible:
          oneOf:
            - type: string
            - type: "null"
        lastTradeAt:
          oneOf:
            - type: string
            - type: "null"
      required: [score, maxScore, mode, entryStatus, reason, nextEligible, lastTradeAt]

    # ── Multi-coin state ────────────────────────────────────────────────────
    MultiCoinState:
      type: object
      properties:
        BTC:
          $ref: "#/components/schemas/PaperTraderState"
        ETH:
          $ref: "#/components/schemas/PaperTraderState"
        SOL:
          $ref: "#/components/schemas/PaperTraderState"
        XRP:
          $ref: "#/components/schemas/PaperTraderState"
        GOLD:
          $ref: "#/components/schemas/PaperTraderState"
        SILVER:
          $ref: "#/components/schemas/PaperTraderState"
      required: [BTC, ETH, SOL, XRP, GOLD, SILVER]

    # ── Engine (server-side scan scheduler) ─────────────────────────────────
    ActiveConditionCheck:
      type: object
      properties:
        name: { type: string }
        currentValue: { type: string }
        requiredValue: { type: string }
        pass: { type: boolean }
      required: [name, currentValue, requiredValue, pass]

    ActiveStrategyState:
      type: object
      description: Latest scan state of the parallel ACTIVE 15-minute strategy.
      properties:
        status:
          type: string
          enum: [READY, DANGER, API_ERROR]
        message:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
        lastCompletedCandleAt:
          type: ["string", "null"]
        decision:
          type: ["string", "null"]
          enum: [LONG, SHORT, NO_TRADE, null]
        decisionReason:
          type: ["string", "null"]
        longScore:
          type: ["number", "null"]
        shortScore:
          type: ["number", "null"]
        threshold:
          type: ["number", "null"]
        maxScore:
          type: ["number", "null"]
        longConditions:
          type: array
          items:
            $ref: "#/components/schemas/ActiveConditionCheck"
        shortConditions:
          type: array
          items:
            $ref: "#/components/schemas/ActiveConditionCheck"
        fifteenTrend:
          type: ["string", "null"]
          enum: [BULLISH, BEARISH, NEUTRAL, null]
        blockReason:
          type: ["string", "null"]
        nextEvaluationAt:
          type: ["string", "null"]
          description: When the next 15m candle completes and entries are re-evaluated.
        thresholdMode:
          type: ["string", "null"]
          enum: [CONSERVATIVE, NORMAL, AGGRESSIVE, null]
        entryEligible:
          type: ["boolean", "null"]
          description: True when a qualified signal has no remaining blocker (or just executed).
        executionBlocker:
          type: ["string", "null"]
          description: Exact remaining blocker, or "No blocker — order should execute…".
        hasOpenPosition:
          type: ["boolean", "null"]
      required: [status]

    StrategyStatsBlock:
      type: object
      description: Performance stats for one strategy bucket (CORE, ACTIVE, or COMBINED).
      properties:
        trades: { type: number }
        wins: { type: number }
        losses: { type: number }
        winRate: { type: number }
        pnl: { type: number }
        roi: { type: number }
        profitFactor: { type: ["number", "null"] }
        maxDrawdown: { type: number }
        estCosts:
          type: ["number", "null"]
          description: Sum of estimated fees + slippage across the bucket.
        pnlNet:
          type: ["number", "null"]
          description: pnl minus estCosts (expectancy after trading costs).
      required: [trades, wins, losses, winRate, pnl, roi, profitFactor, maxDrawdown]

    StrategyStats:
      type: object
      properties:
        core:
          $ref: "#/components/schemas/StrategyStatsBlock"
        active:
          $ref: "#/components/schemas/StrategyStatsBlock"
        combined:
          $ref: "#/components/schemas/StrategyStatsBlock"
      required: [core, active, combined]

    ChartCandle:
      type: object
      description: One completed candle plus indicator values at its close.
      properties:
        t:
          type: number
          description: Candle START time (UTC seconds)
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v: { type: number }
        ema20: { type: ["number", "null"] }
        ema50: { type: ["number", "null"] }
        rsi: { type: ["number", "null"] }
        macd: { type: ["number", "null"] }
        macdSignal: { type: ["number", "null"] }
      required: [t, o, h, l, c, v, ema20, ema50, rsi, macd, macdSignal]

    ChartSignalPoint:
      type: object
      description: A historical qualifying strategy signal (executed or blocked).
      properties:
        ts:
          type: number
        direction:
          type: ["string", "null"]
        executed:
          type: boolean
        blockedReason:
          type: ["string", "null"]
      required: [ts, direction, executed, blockedReason]

    ChartData:
      type: object
      description: Price chart payload — same market data the strategy engine uses.
      properties:
        asset: { type: string }
        display: { type: string }
        currency: { type: string }
        range: { type: string }
        interval:
          type: string
          description: Candle timeframe used (15m, 1h or 4h).
        currentPrice:
          type: ["number", "null"]
          description: Live market price at request time (best effort; null if the price feed failed).
        intervalSeconds: { type: number }
        dataSource: { type: string }
        candles:
          type: array
          items:
            $ref: "#/components/schemas/ChartCandle"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/ChartSignalPoint"
        elliott:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ElliottChartOverlay"
      required: [asset, display, currency, range, intervalSeconds, dataSource, candles, signals]

    EngineStatus:
      type: object
      description: Status of the background strategy-scan scheduler in the API server.
      properties:
        status:
          type: string
          enum: [RUNNING, ERROR, STARTING]
        lastScanAt:
          type: ["string", "null"]
        nextScanAt:
          type: ["string", "null"]
        intervalSeconds:
          type: number
        lastError:
          type: ["string", "null"]
        scansCompleted:
          type: number
        consecutiveErrors:
          type: number
          description: Number of consecutive failed scans since last success. Resets to 0 on recovery.
      required: [status, lastScanAt, nextScanAt, intervalSeconds, lastError, scansCompleted, consecutiveErrors]

    TestAlertResult:
      type: object
      description: Result of a test webhook alert delivery attempt.
      properties:
        ok:
          type: boolean
          description: True when the webhook returned a 2xx response; false otherwise.
        message:
          type: string
          description: Human-readable delivery result or error detail.
      required: [ok, message]

    EngineHealthStatus:
      type: object
      description: Simplified health-check response for external uptime monitors (UptimeRobot, Better Uptime, etc.).
      properties:
        status:
          type: string
          enum: [ok, error]
          description: '"ok" when engine is RUNNING or STARTING; "error" when it is in ERROR state.'
        engine:
          type: string
          enum: [RUNNING, ERROR, STARTING]
        consecutiveErrors:
          type: number
        lastError:
          type: ["string", "null"]
        lastScanAt:
          type: ["string", "null"]
        alertThreshold:
          type: number
          description: Number of consecutive failures that trigger a webhook alert.
        alertWebhookConfigured:
          type: boolean
          description: Whether ALERT_WEBHOOK_URL is set in the server environment.
      required: [status, engine, consecutiveErrors, lastError, lastScanAt, alertThreshold, alertWebhookConfigured]

    ExecutionDiagnostics:
      type: object
      description: Explicit entry-eligibility report — every active blocker, named.
      properties:
        eligible:
          type: boolean
        blockers:
          type: array
          items:
            type: string
        lastCompletedCandleAt:
          type: ["string", "null"]
        checkedAt:
          type: ["string", "null"]
      required: [eligible, blockers]

    # ── Portfolio ───────────────────────────────────────────────────────────
    PortfolioSummary:
      type: object
      properties:
        openPositions:
          type: ["number", "null"]
        totalInstruments:
          type: ["number", "null"]
        totalOpenRisk:
          type: ["number", "null"]
          description: Sum of riskAmount across all open paper positions (£/$ aggregated 1:1).
        openRiskPercent:
          type: ["number", "null"]
        riskCeilingPercent:
          type: ["number", "null"]
        totalStarting:
          type: number
        totalBalance:
          type: number
        totalPnl:
          type: number
        totalRoi:
          type: number
        totalTrades:
          type: number
        totalWins:
          type: number
        totalLosses:
          type: number
        overallWinRate:
          type: number
        coins:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PaperTraderMetrics"
        strategyStats:
          oneOf:
            - $ref: "#/components/schemas/StrategyStats"
            - type: "null"
        activeMode:
          type: ["string", "null"]
          enum: [CONSERVATIVE, NORMAL, AGGRESSIVE, null]
          description: Current ACTIVE strategy threshold mode (user-selected, never auto-switched).
        activeThreshold:
          type: ["number", "null"]
          description: Conditions required by the current ACTIVE mode (3, 4, or 5 of 6).
      required: [totalStarting, totalBalance, totalPnl, totalRoi, totalTrades, totalWins, totalLosses, overallWinRate, coins]

    # ── Activity log ────────────────────────────────────────────────────────
    ActivityEvent:
      type: object
      properties:
        id:
          type: number
        coin:
          type: string
        event:
          type: string
        message:
          type: string
        ts:
          type: string
      required: [id, coin, event, message, ts]

    # ── Input schemas ───────────────────────────────────────────────────────
    SetActiveModeInput:
      type: object
      properties:
        mode:
          type: string
          enum: [CONSERVATIVE, NORMAL, AGGRESSIVE]
      required: [mode]

    SetActiveModeResult:
      type: object
      properties:
        ok:
          type: boolean
        mode:
          type: ["string", "null"]
        threshold:
          type: ["number", "null"]
        error:
          type: ["string", "null"]
      required: [ok]

    ResetPaperTraderInput:
      type: object
      properties:
        startingBalance:
          type: number
          minimum: 0
